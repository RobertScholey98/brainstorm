# Builds, tests and packages Brainstorm on Windows, macOS and Linux for every push to main and every pull request.
#
# To release, run this workflow from the Actions tab on main and pick patch, minor or major. It bumps the latest
# vX.Y.Z tag (scripts/next-version.ts), builds every installer at that version, then pushes the tag and drafts a
# GitHub release with them attached; publish the draft by hand once it looks right. A failed build pushes no tag.
#
# Signing is off until these repository secrets exist (electron-builder picks them up; nothing else changes):
#   MAC_CERTIFICATE, MAC_CERTIFICATE_PASSWORD   Developer ID Application .p12, base64, and its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization
#   WIN_CERTIFICATE, WIN_CERTIFICATE_PASSWORD   Windows code-signing .pfx, base64, and its password
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Release as the next
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# A newer push cancels an older build of the same ref, but never a release.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: next
        name: Work out the version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::release from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          version=$(node scripts/next-version.ts "$BUMP")
          echo "Releasing v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, platform: --win }
          - { name: macOS, os: macos-latest, platform: --mac }
          - { name: Linux, os: ubuntu-latest, platform: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      # The design.css drift test compares bytes with the generator's LF output.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Also runs prepare, which builds dist/.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The packaged app reports package.json's version, and the installers are named after it.
      - name: Set the release version
        if: needs.version.outputs.release == 'true'
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Package
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags="${{ matrix.platform }}"
          # electron-builder reads an empty CSC_LINK as a certificate path, so it's only exported when a secret is set.
          case "$RUNNER_OS" in
            macOS)
              if [ -n "$MAC_CERTIFICATE" ]; then
                export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
              else
                # Sign ad hoc, since Apple Silicon refuses to launch an unsigned app at all. electron-builder skips
                # every signature on a pull request unless told otherwise; with no certificate there's nothing to leak.
                flags="$flags -c.mac.identity=- -c.mac.hardenedRuntime=false"
                export CSC_FOR_PULL_REQUEST=true
              fi
              ;;
            Windows)
              if [ -n "$WIN_CERTIFICATE" ]; then
                export CSC_LINK="$WIN_CERTIFICATE" CSC_KEY_PASSWORD="$WIN_CERTIFICATE_PASSWORD"
              fi
              ;;
          esac
          npx electron-builder $flags --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: brainstorm-${{ runner.os }}
          # latest*.yml is the update feed (latest.yml for Windows, latest-mac.yml for the Mac .zip, latest-linux.yml for
          # the .deb), and the .blockmap lets an installed app download only the parts of the installer that changed.
          path: |
            release/*.exe
            release/*.pkg
            release/*.zip
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  # Installs a build, updates it from a local feed through the sidebar's Restart to update, and uninstalls
  # (scripts/verify/update.mjs). Linux's .deb update is electron-updater's own and isn't covered here.
  update:
    name: Update (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify:update

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Tagged only now that every installer built. A draft release makes no tag until it's published, so the tag is
      # pushed here, and the next release counts up from it even while this draft waits.
      - name: Tag the commit
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: brainstorm-*
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Brainstorm $TAG" \
            --generate-notes
